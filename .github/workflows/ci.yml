name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch: a push while a PR is open makes the
# earlier run irrelevant, and re-running it wastes the runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # scripts/ptycheck.py rather than an inline script.
      #
      # The smoke test has to exist, and a second copy of it inside this file would be
      # a second thing to keep in step with the application — the failure mode being a
      # check that asserts on a string the interface no longer uses, which fails for a
      # reason that has nothing to do with the code.
      - name: Build
        run: make build

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test with the race detector
        run: make test

      - name: Confirm the binary is static
        run: |
          # CGO is off deliberately: the binary must be static, and the build must not
          # depend on the runner's C toolchain matching anything.
          if file bin/wterm | grep -q 'dynamically linked'; then
            echo "::error::wterm must be statically linked"
            file bin/wterm
            exit 1
          fi

      - name: Smoke test on a real pty
        # A Bubble Tea application negotiates capabilities with the terminal and blocks
        # on answers it never receives without a tty on stdin, so a TUI cannot be
        # exercised any other way.
        run: make pty

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # v2.14.0 rather than the latest tag: v2.6.x cannot read Go 1.27 export data and
      # fails with a typecheck error that looks like a defect in the code.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0